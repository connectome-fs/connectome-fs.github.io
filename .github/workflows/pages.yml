name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Verify crawlable output
        shell: bash
        run: |
          test -s .output/public/index.html
          test -s .output/public/sitemap.xml
          test -s .output/public/sitemap-site.xml
          test -s .output/public/robots.txt
          grep -q "connectome-fs" .output/public/index.html
          grep -q "https://connectome-fs.github.io/sitemap-site.xml" .output/public/sitemap.xml
          grep -Fq "Sitemap: https://connectome-fs.github.io/connectome-fs/sitemap.xml" .output/public/robots.txt
          grep -Fq "Sitemap: https://connectome-fs.github.io/connectome-fs/docs/sitemap.xml" .output/public/robots.txt
          ! test -d .output/public/docs
          # Marketing HTML must not deep-link the project Pages path; robots/sitemaps may advertise it.
          ! grep -RFq "https://connectome-fs.github.io/connectome-fs/" .output/public --include='*.html'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
